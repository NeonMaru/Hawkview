<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hawkview — 3D Badminton Shot Explorer & Match Analytics</title>

  <!-- Three.js (r128) & OrbitControls with Local Offline Fallback -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    if (!window.THREE) {
      document.write('<script src="js/vendor/three.min.js"><\/script>');
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    if (!window.THREE || !window.THREE.OrbitControls) {
      document.write('<script src="js/vendor/OrbitControls.js"><\/script>');
    }
  </script>

  <!-- Clean PB-Vision Style Sheet (Spec Section 2.2) -->
  <link rel="stylesheet" href="css/hawkview.css">
</head>
<body>

  <!-- ========================================================================
       TOP BAR
       ======================================================================== -->
  <header class="hv-topbar">
    <div class="hv-brand">
      <span class="hv-brand-title">Hawkview</span>
      <span style="color:var(--border);">|</span>
      <span id="header-match-title" class="hv-match-meta">
        BWF Arctic Open 2024 Super 500 · Quarter-Final Men's Singles · Lee Zii Jia vs Christo Popov
      </span>
    </div>

    <div class="hv-topbar-actions">
      <button id="btn-analyze-clip" class="hv-btn" title="View pipeline telemetry & measured accuracy">
        Pipeline Info
      </button>
      <button id="btn-theme-toggle" class="hv-btn" title="Toggle Light / Dark theme">
        ☾ Dark
      </button>
    </div>
  </header>

  <!-- ========================================================================
       SECTION 3 WORKSPACE GRID
       ======================================================================== -->
  <main class="hv-workspace">

    <!-- 3.3 PLAYER CARD (Left Top) -->
    <section id="player-card-container" class="hv-panel hv-area-player">
      <!-- Populated by js/player-card.js -->
    </section>

    <!-- 3.1 3D COURT (SHOT EXPLORER) + CAMERA BUTTON STACK + 3.2 FILTER BAR -->
    <section class="hv-area-explorer">

      <!-- 3D Court Panel (Header Strip + 3D Canvas + Right Vertical Camera Stack) -->
      <div class="hv-court-card">
        <!-- Non-overlapping Top Bar: Playback vs Explorer Mode + Shot Legend -->
        <div class="hv-court-overlay-top">
          <div class="hv-court-mode-bar">
            <span style="font-weight:600; color:var(--muted);">Mode:</span>
            <button id="mode-btn-playback" class="hv-btn" style="padding:3px 8px; font-size:11px;" title="Follow video playback (current shot 100%, earlier in rally 30%)">Playback</button>
            <button id="mode-btn-explorer" class="hv-btn active" style="padding:3px 8px; font-size:11px;" title="Show all matching shots across the match">Explorer</button>
            <span id="explorer-shot-count-badge" class="hv-badge">223 / 223 shots</span>
          </div>

          <div class="hv-court-legend">
            <span class="hv-legend-item"><span class="hv-legend-swatch" style="background:var(--shot-continue);"></span>Continue</span>
            <span class="hv-legend-item"><span class="hv-legend-swatch" style="background:var(--shot-winner);"></span>Winner</span>
            <span class="hv-legend-item"><span class="hv-legend-swatch" style="background:var(--shot-error);"></span>Error</span>
            <span class="hv-legend-item"><span class="hv-legend-swatch" style="background:var(--shot-selected);"></span>Selected</span>
            <span class="hv-legend-item"><span class="hv-legend-dashed"></span>Low-conf</span>
          </div>
        </div>

        <div class="hv-court-row">
          <div class="hv-court-stage">
            <!-- Three.js Canvas Mount -->
            <div id="three-viewport-container" style="width:100%; height:100%; position:relative;"></div>

            <!-- Floating Hover Tooltip -->
            <div id="shot-hover-tooltip" class="hv-shot-tooltip hidden"></div>
          </div>

          <!-- Vertical Camera Button Stack (PB Vision style) -->
          <aside class="hv-cam-stack" aria-label="Camera views">
            <button id="cam-btn-3d" class="hv-cam-btn active" title="Elevated 3D perspective behind near baseline">3D</button>
            <button id="cam-btn-top" class="hv-cam-btn" title="Orthographic top-down view">Top</button>
            <button id="cam-btn-side" class="hv-cam-btn" title="Side view level with net line (net in profile)">Side</button>
            <button id="cam-btn-net" class="hv-cam-btn" title="Eye level at net post">Net</button>
            <button id="cam-btn-near" class="hv-cam-btn" title="Behind near baseline at player eye height">Near</button>
            <button id="cam-btn-far" class="hv-cam-btn" title="Behind far baseline at player eye height">Far</button>
            <div class="hv-cam-btn-spacer"></div>
            <button id="cam-btn-fullscreen" class="hv-cam-btn" title="Toggle fullscreen court">⛶</button>
          </aside>
        </div>
      </div>

      <!-- 3.2 FILTER BAR (Compact on Desktop, Collapsible Drawer on Mobile) -->
      <div class="hv-filter-bar" id="filter-bar-container" role="region" aria-label="Shot filters">
        <div class="hv-filter-mobile-header">
          <button id="btn-toggle-mobile-filters" type="button" class="hv-btn" style="padding:4px 10px; font-size:11.5px;">
            Filters ▾
          </button>
          <span id="filter-mobile-summary" class="hv-filter-summary">223 / 223 shots</span>
        </div>

        <div id="filter-bar-controls" class="hv-filter-controls">
          <div class="hv-filter-group">
            <label class="hv-filter-label" for="filter-game">Game</label>
            <select id="filter-game" class="hv-select">
              <option value="all">All</option>
              <option value="1">Game 1</option>
              <option value="2">Game 2</option>
            </select>
          </div>

          <div class="hv-filter-group">
            <label class="hv-filter-label" for="filter-rally">Rally</label>
            <select id="filter-rally" class="hv-select">
              <option value="all">All Rallies</option>
            </select>
          </div>

          <div class="hv-filter-group">
            <label class="hv-filter-label" for="filter-player">Player</label>
            <select id="filter-player" class="hv-select">
              <option value="all">All</option>
              <option value="LZJ">LZJ</option>
              <option value="POPOV">POPOV</option>
            </select>
          </div>

          <div class="hv-filter-group">
            <label class="hv-filter-label" for="filter-shot-type">Type</label>
            <select id="filter-shot-type" class="hv-select">
              <option value="all">All types</option>
              <option value="smash">smash</option>
              <option value="clear">clear (all)</option>
              <option value="attacking_clear">attacking_clear</option>
              <option value="defensive_clear">defensive_clear</option>
              <option value="drive">drive</option>
              <option value="drop">drop</option>
              <option value="lift">lift</option>
              <option value="push">push</option>
              <option value="net_shot">net_shot</option>
              <option value="net_kill">net_kill</option>
              <option value="block">block</option>
              <option value="serve">serve (all)</option>
              <option value="serve_short">serve_short</option>
              <option value="serve_flick">serve_flick</option>
              <option value="serve_drive">serve_drive</option>
              <option value="serve_long">serve_long</option>
              <option value="other">other</option>
            </select>
          </div>

          <div class="hv-filter-group">
            <label class="hv-filter-label" for="filter-outcome">Outcome</label>
            <select id="filter-outcome" class="hv-select">
              <option value="all">All</option>
              <option value="continue">continue</option>
              <option value="winner">winner</option>
              <option value="error_out">error_out</option>
              <option value="error_net">error_net</option>
            </select>
          </div>

          <div class="hv-filter-group">
            <label class="hv-filter-label" for="filter-contact-zone">Zone</label>
            <select id="filter-contact-zone" class="hv-select">
              <option value="all">All</option>
              <option value="front">front</option>
              <option value="mid">mid</option>
              <option value="rear">rear</option>
            </select>
          </div>

          <div class="hv-filter-group">
            <label class="hv-filter-label" for="filter-min-speed">Speed</label>
            <input id="filter-min-speed" type="range" min="0" max="400" step="10" value="0" style="width:76px;" class="hv-slider">
            <span id="filter-min-speed-val" class="tabular-nums" style="font-size:11px; min-width:48px;">0 km/h</span>
          </div>

          <label class="hv-filter-group" style="cursor:pointer;">
            <input id="filter-terminal-only" type="checkbox">
            <span class="hv-filter-label" style="color:var(--text);">Terminal only</span>
          </label>

          <button id="btn-clear-filters" class="hv-btn" style="padding:3px 8px; font-size:11px;">Clear</button>
          <span id="filter-active-summary" class="hv-filter-summary">223 / 223 shots</span>
        </div>
      </div>
    </section>

    <!-- 3.4 RALLY DECK (Left Middle) -->
    <section id="rally-deck-container" class="hv-panel hv-area-rallies">
      <!-- Populated by js/rally-deck.js -->
    </section>

    <!-- VIDEO PLAYER (Right Top, 1:1 sync) -->
    <section class="hv-panel hv-area-video">
      <div class="hv-panel-header" style="flex-wrap:wrap;">
        <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0;">
          <h2 class="hv-panel-title">Broadcast Video (1:1 Sync)</h2>
          <span id="video-rally-status-badge" class="hv-badge">R1</span>
        </div>
        <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
          <button id="btn-toggle-video-mute" class="hv-btn" style="padding:3px 8px; font-size:11px;">🔊 Audio</button>
          <button id="btn-load-custom-video" class="hv-btn" style="padding:3px 8px; font-size:11px;">Load MP4</button>
          <input type="file" id="video-file-input" accept="video/mp4,video/webm,video/quicktime" style="display:none;">
        </div>
      </div>

      <div class="hv-video-stage">
        <video id="real-video-player" src="assets/LZJvPopov.mp4" playsinline preload="auto"
               style="width:100%; height:100%; object-fit:contain; background:#000;"></video>
      </div>

      <div class="hv-video-controls">
        <div class="hv-timeline-track-wrapper">
          <div id="rally-timeline-ticks" class="rally-timeline-ticks"></div>
          <input id="rally-timeline-slider" type="range" min="0" max="499" value="14.5" step="0.04"
                 class="hv-slider" style="position:relative; z-index:4;"
                 title="Scrub broadcast video & 3D Shot Explorer in lockstep">
        </div>

        <div style="display:flex; align-items:center; justify-content:space-between; gap:6px; flex-wrap:wrap;">
          <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
            <button id="btn-play-pause" class="hv-btn hv-btn-primary">▶ Play</button>
            <button id="btn-prev-rally" class="hv-btn">⏮ Prev Rally</button>
            <button id="btn-next-rally" class="hv-btn">⏭ Next Rally</button>
          </div>
          <div class="tabular-nums" style="font-size:12px; color:var(--muted);">
            <span id="timeline-timecode-elapsed" style="color:var(--text); font-weight:600;">00:14.5</span>
            <span> / </span>
            <span id="timeline-timecode-total">08:18.4</span>
          </div>
        </div>
      </div>
    </section>

    <!-- 3.5 ANALYTICS CARDS (Full Width Bottom) -->
    <section id="analytics-cards-container" class="hv-area-analytics">
      <!-- Populated by js/analytics-cards.js -->
    </section>

  </main>

  <!-- ========================================================================
       PLAIN PIPELINE PROGRESS & TELEMETRY MODAL (Spec Section 2.1)
       ======================================================================== -->
  <div id="anti-lag-modal" class="hv-modal-backdrop hidden">
    <div class="hv-modal-card">
      <div class="hv-panel-header">
        <h2 class="hv-panel-title" style="font-size:13px; color:var(--text);">Pipeline Telemetry & Measured Metrics</h2>
        <button id="btn-close-modal" class="hv-btn" style="padding:3px 8px;">✕</button>
      </div>

      <div id="anti-lag-modal-body">
        <!-- Populated by js/anti-lag-modal.js with real measured numbers -->
      </div>

      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px; padding-top:10px; border-top:1px solid var(--border);">
        <button id="btn-export-telemetry" class="hv-btn hv-btn-primary">Download match_telemetry.json</button>
      </div>
    </div>
  </div>

  <!-- Application Scripts -->
  <script src="js/telemetry-data.js"></script>
  <script src="js/three-viewport.js"></script>
  <script src="js/shot-explorer.js"></script>
  <script src="js/filter-bar.js"></script>
  <script src="js/player-card.js"></script>
  <script src="js/rally-deck.js"></script>
  <script src="js/analytics-cards.js"></script>
  <script src="js/broadcast-player.js"></script>
  <script src="js/anti-lag-modal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
