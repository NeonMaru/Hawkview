name: Hawkview Cloud YouTube to 3D Worker

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube video URL"
        required: true
        type: string
      video_id:
        description: "11-char YouTube video ID"
        required: false
        default: ""
        type: string
      job_id:
        description: "Netlify Blobs job_id"
        required: true
        type: string
      match_id:
        description: "Target match_id (e.g. yt_<id>)"
        required: true
        type: string
      max_rallies:
        description: "Maximum rallies to reconstruct"
        required: false
        default: "3"
        type: string
      callback_url:
        description: "Netlify callback URL for streaming progress & telemetry"
        required: true
        type: string

jobs:
  convert-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Notify Cloud Runner Booted (7.5%)
        env:
          HAWKVIEW_CALLBACK_SECRET: ${{ secrets.HAWKVIEW_CALLBACK_SECRET }}
        run: |
          curl -fsS --max-time 10 -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Hawkview-Secret: $HAWKVIEW_CALLBACK_SECRET" \
            -d "{\"job_id\":\"${{ inputs.job_id }}\",\"match_id\":\"${{ inputs.match_id }}\",\"video_id\":\"${{ inputs.video_id }}\",\"status\":\"running\",\"stage\":\"Cloud Runner Ready\",\"percent\":7.5,\"message\":\"Cloud Linux worker booted; loading CV runtime...\"}" || true

      - name: Checkout Hawkview
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js & Deno (for yt-dlp EJS runtime)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Deno (yt-dlp default JS solver)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Python & RTMPose Weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/rtmlib
            ~/.cache/yt-dlp
          key: hawkview-cv-v1-${{ runner.os }}-py312

      - name: Install ffmpeg, google-colab-cli & Python CV Dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg tesseract-ocr > /dev/null
          python3 -m pip install --upgrade --quiet pip yt-dlp google-colab-cli
          python3 -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
          python3 -m pip install --quiet opencv-python-headless numpy scipy onnxruntime rtmlib pytesseract pillow

      - name: Notify Dependencies Loaded (13.5%)
        env:
          HAWKVIEW_CALLBACK_SECRET: ${{ secrets.HAWKVIEW_CALLBACK_SECRET }}
        run: |
          curl -fsS --max-time 10 -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Hawkview-Secret: $HAWKVIEW_CALLBACK_SECRET" \
            -d "{\"job_id\":\"${{ inputs.job_id }}\",\"match_id\":\"${{ inputs.match_id }}\",\"video_id\":\"${{ inputs.video_id }}\",\"status\":\"running\",\"stage\":\"Connecting to Cloud GPU\",\"percent\":13.5,\"message\":\"CV runtime ready; downloading YouTube stream & provisioning GPU...\"}" || true

      - name: Prepare Encrypted Cloud Secrets (YouTube Cookies + Google Colab Blackwell Token)
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          COLAB_TOKEN_JSON_B64: ${{ secrets.COLAB_TOKEN_JSON_B64 }}
        run: |
          if [ -n "$YOUTUBE_COOKIES_B64" ]; then
            echo "$YOUTUBE_COOKIES_B64" | base64 --decode > /tmp/yt_cookies.txt
            chmod 600 /tmp/yt_cookies.txt
          fi
          if [ -n "$COLAB_TOKEN_JSON_B64" ]; then
            mkdir -p ~/.config/colab-cli
            echo "$COLAB_TOKEN_JSON_B64" | base64 --decode > ~/.config/colab-cli/token.json
            chmod 600 ~/.config/colab-cli/token.json
            colab whoami || true
            colab usage || true
          fi

      - name: Run Cloud YouTube -> Blackwell G4 GPU -> 3D Physics Pipeline
        env:
          HAWKVIEW_CALLBACK_SECRET: ${{ secrets.HAWKVIEW_CALLBACK_SECRET }}
        run: |
          COOKIES_ARG=""
          if [ -f /tmp/yt_cookies.txt ]; then
            COOKIES_ARG="--cookies-file /tmp/yt_cookies.txt"
          fi
          python3 tools/cloud_youtube_worker.py \
            --url "${{ inputs.youtube_url }}" \
            --job-id "${{ inputs.job_id }}" \
            --match-id "${{ inputs.match_id }}" \
            --max-rallies "${{ inputs.max_rallies }}" \
            --callback-url "${{ inputs.callback_url }}" \
            $COOKIES_ARG

      - name: Report Unexpected Workflow Crash
        if: failure()
        env:
          HAWKVIEW_CALLBACK_SECRET: ${{ secrets.HAWKVIEW_CALLBACK_SECRET }}
        run: |
          curl -fsS --max-time 10 -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Hawkview-Secret: $HAWKVIEW_CALLBACK_SECRET" \
            -d "{\"job_id\":\"${{ inputs.job_id }}\",\"match_id\":\"${{ inputs.match_id }}\",\"video_id\":\"${{ inputs.video_id }}\",\"status\":\"error\",\"stage\":\"Cloud Runner Error\",\"percent\":100,\"error\":\"Cloud runner stopped before completing 3D reconstruction. Tap Convert to retry.\",\"error_code\":\"workflow_failed\"}" || true

      - name: Cleanup Temporary Secrets & Verify Zero Active Colab VMs
        if: always()
        run: |
          colab sessions || true
          rm -f /tmp/yt_cookies.txt ~/.config/colab-cli/token.json
