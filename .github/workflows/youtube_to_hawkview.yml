name: Hawkview Cloud YouTube to 3D Worker

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube video URL (leave blank for direct MP4 upload)"
        required: false
        default: ""
        type: string
      video_id:
        description: "11-char YouTube video ID"
        required: false
        default: ""
        type: string
      upload_id:
        description: "Netlify Blobs chunked upload_id (direct phone MP4 upload)"
        required: false
        default: ""
        type: string
      upload_chunks:
        description: "Total uploaded binary chunks"
        required: false
        default: "0"
        type: string
      upload_filename:
        description: "Original uploaded MP4 filename"
        required: false
        default: "phone_match.mp4"
        type: string
      upload_endpoint:
        description: "Authenticated Netlify Blobs chunk download URL"
        required: false
        default: ""
        type: string
      job_id:
        description: "Netlify Blobs job_id"
        required: true
        type: string
      match_id:
        description: "Target match_id (e.g. yt_<id>)"
        required: true
        type: string
      max_rallies:
        description: "Maximum rallies to reconstruct"
        required: false
        default: "3"
        type: string
      callback_url:
        description: "Netlify callback URL for streaming progress & telemetry"
        required: true
        type: string

jobs:
  convert-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Notify Cloud Runner Booted (7.5%)
        env:
          HAWKVIEW_CALLBACK_SECRET: ${{ secrets.HAWKVIEW_CALLBACK_SECRET }}
        run: |
          curl -fsS --max-time 10 -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Hawkview-Secret: $HAWKVIEW_CALLBACK_SECRET" \
            -d "{\"job_id\":\"${{ inputs.job_id }}\",\"match_id\":\"${{ inputs.match_id }}\",\"video_id\":\"${{ inputs.video_id }}\",\"status\":\"running\",\"stage\":\"Cloud Runner Ready\",\"percent\":7.5,\"message\":\"Cloud Linux worker booted; loading CV runtime...\"}" || true

      - name: Checkout Hawkview
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js & Deno (for yt-dlp EJS runtime)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Deno (yt-dlp default JS solver)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Pre-Built Python CV Venv & RTMPose Weights
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hawkview-venv
            ~/.cache/rtmlib
            ~/.cache/yt-dlp
          key: hawkview-venv-v2-${{ runner.os }}-py312

      - name: Activate / Build Fast Python CV Venv
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::Retries=2 update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null || true
          fi
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::Retries=2 update -qq && sudo apt-get install -y -qq --no-install-recommends tesseract-ocr > /dev/null || true
          fi
          if [ ! -x "$HOME/.cache/hawkview-venv/bin/python" ]; then
            python3 -m venv "$HOME/.cache/hawkview-venv"
            "$HOME/.cache/hawkview-venv/bin/pip" install --upgrade --quiet pip yt-dlp google-colab-cli
            "$HOME/.cache/hawkview-venv/bin/pip" install --quiet --index-url https://download.pytorch.org/whl/cpu torch
            "$HOME/.cache/hawkview-venv/bin/pip" install --quiet opencv-python-headless numpy scipy onnxruntime rtmlib pytesseract pillow
          else
            "$HOME/.cache/hawkview-venv/bin/pip" install --upgrade --quiet yt-dlp || true
          fi
          echo "$HOME/.cache/hawkview-venv/bin" >> "$GITHUB_PATH"

      - name: Notify Dependencies Loaded (13.5%)
        env:
          HAWKVIEW_CALLBACK_SECRET: ${{ secrets.HAWKVIEW_CALLBACK_SECRET }}
        run: |
          curl -fsS --max-time 10 -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Hawkview-Secret: $HAWKVIEW_CALLBACK_SECRET" \
            -d "{\"job_id\":\"${{ inputs.job_id }}\",\"match_id\":\"${{ inputs.match_id }}\",\"video_id\":\"${{ inputs.video_id }}\",\"status\":\"running\",\"stage\":\"Connecting to Cloud GPU\",\"percent\":13.5,\"message\":\"CV runtime ready; downloading YouTube stream & provisioning GPU...\"}" || true

      - name: Prepare Encrypted Cloud Secrets (YouTube Cookies + Google Colab Blackwell Token)
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          COLAB_TOKEN_JSON_B64: ${{ secrets.COLAB_TOKEN_JSON_B64 }}
        run: |
          if [ -n "$YOUTUBE_COOKIES_B64" ]; then
            echo "$YOUTUBE_COOKIES_B64" | base64 --decode > /tmp/yt_cookies.txt
            chmod 600 /tmp/yt_cookies.txt
          fi
          if [ -n "$COLAB_TOKEN_JSON_B64" ]; then
            mkdir -p ~/.config/colab-cli
            echo "$COLAB_TOKEN_JSON_B64" | base64 --decode > ~/.config/colab-cli/token.json
            chmod 600 ~/.config/colab-cli/token.json
            colab whoami || true
            colab usage || true
          fi

      - name: Run Cloud YouTube / MP4 -> Blackwell G4 GPU -> 3D Physics Pipeline
        env:
          HAWKVIEW_CALLBACK_SECRET: ${{ secrets.HAWKVIEW_CALLBACK_SECRET }}
        run: |
          EXTRA_ARGS=""
          if [ -f /tmp/yt_cookies.txt ]; then
            EXTRA_ARGS="$EXTRA_ARGS --cookies-file /tmp/yt_cookies.txt"
          fi
          if [ -n "${{ inputs.upload_id }}" ]; then
            python3 tools/cloud_youtube_worker.py \
              --upload-id "${{ inputs.upload_id }}" \
              --upload-chunks "${{ inputs.upload_chunks }}" \
              --upload-filename "${{ inputs.upload_filename }}" \
              --upload-endpoint "${{ inputs.upload_endpoint }}" \
              --job-id "${{ inputs.job_id }}" \
              --match-id "${{ inputs.match_id }}" \
              --max-rallies "${{ inputs.max_rallies }}" \
              --callback-url "${{ inputs.callback_url }}"
          else
            python3 tools/cloud_youtube_worker.py \
              --url "${{ inputs.youtube_url }}" \
              --job-id "${{ inputs.job_id }}" \
              --match-id "${{ inputs.match_id }}" \
              --max-rallies "${{ inputs.max_rallies }}" \
              --callback-url "${{ inputs.callback_url }}" \
              $EXTRA_ARGS
          fi

      - name: Report Unexpected Workflow Crash
        if: failure()
        env:
          HAWKVIEW_CALLBACK_SECRET: ${{ secrets.HAWKVIEW_CALLBACK_SECRET }}
        run: |
          if [ ! -f /tmp/worker_reported_error ]; then
            curl -fsS --max-time 10 -X POST "${{ inputs.callback_url }}" \
              -H "Content-Type: application/json" \
              -H "X-Hawkview-Secret: $HAWKVIEW_CALLBACK_SECRET" \
              -d "{\"job_id\":\"${{ inputs.job_id }}\",\"match_id\":\"${{ inputs.match_id }}\",\"video_id\":\"${{ inputs.video_id }}\",\"status\":\"error\",\"stage\":\"Cloud Runner Error\",\"percent\":100,\"error\":\"Cloud runner stopped before completing 3D reconstruction. Tap Convert to retry.\",\"error_code\":\"workflow_failed\"}" || true
          fi

      - name: Cleanup Temporary Secrets & Verify Zero Active Colab VMs
        if: always()
        run: |
          colab sessions || true
          rm -f /tmp/yt_cookies.txt ~/.config/colab-cli/token.json
